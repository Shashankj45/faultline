name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build, Vet & Test (Go + React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build React Frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify Go Formatting & Vet
        run: |
          go vet ./...

      - name: Run Tests with Race Detector
        run: |
          go test -v -race -count=1 ./...

      - name: Compile FaultLine Binary
        run: |
          go build -v -o faultline ./cmd/faultline

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: faultline:ci
