version: '3.8'

services:
  faultline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faultline-proxy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://faultline:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/faultline_db?sslmode=disable
      - FAULTLINE_ADMIN_TOKEN=${FAULTLINE_ADMIN_TOKEN:-}
      - FAULTLINE_MOCK_SERVICES=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: faultline-postgres
    environment:
      POSTGRES_USER: faultline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: faultline_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultline -d faultline_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: faultline-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

volumes:
  pgdata:
